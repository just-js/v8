name: build v8 libs (reusable)
on:
  workflow_call:

env:
  V8_VERSION: "14.6"

defaults:
  run:
    shell: bash

jobs:

  build-linux-x64:
#    if: ${{ false }}  # disable
    name: linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: setup env
        run: |
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"
      # same caching pattern validated on the Windows job (build-windows
      # below) - see its own comments for the actions/cache
      # save-skips-on-later-failure gotcha and the staleness rationale.
      # PLAN.md task 41.
      - name: restore depot_tools cache
        id: depot-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: depot_tools
          key: depot_tools-linux-x64-v1
      - name: clone depot_tools
        if: steps.depot-tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
      - name: save depot_tools cache
        if: steps.depot-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: depot_tools
          key: depot_tools-linux-x64-v1
      - name: clean depot_tools checkout
        run: |
          git -C depot_tools reset --hard
          git -C depot_tools clean -fd
      - name: init depot_tools
        run: |
          gclient
      - name: restore v8 checkout cache
        id: v8-cache
        uses: actions/cache/restore@v4
        with:
          path: v8
          key: v8-src-linux-x64-${{ env.V8_VERSION }}-v1
      - name: fetch v8
        if: steps.v8-cache.outputs.cache-hit != 'true'
        run: |
          fetch v8
          cd v8
          git checkout branch-heads/$V8_VERSION
          gclient sync
      - name: save v8 checkout cache
        if: steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: v8
          key: v8-src-linux-x64-${{ env.V8_VERSION }}-v1
      - name: compile v8
        run: |
          cd ${{ github.workspace }}/v8
          ./build/install-build-deps.sh
          mkdir -p out.gn/linux.${{ matrix.platform }}.release/
          cp ${{ github.workspace }}/args.linux.${{ matrix.platform }}.gn $GITHUB_WORKSPACE/v8/out.gn/linux.${{ matrix.platform }}.release/args.gn
          gn gen out.gn/linux.${{ matrix.platform }}.release
          ninja v8_monolith -C out.gn/linux.${{ matrix.platform }}.release/
          gn args --list out.gn/linux.${{ matrix.platform }}.release
          tar -zcvf ../include.tar.gz include
          tar -zcvf ../src.tar.gz src
          gzip -9 -c out.gn/linux.${{ matrix.platform }}.release/obj/libv8_monolith.a > ../libv8_monolith-linux-${{ matrix.platform }}.a.gz
          tar -zcvf ../gen-linux-${{ matrix.platform }}.tar.gz out.gn/linux.${{ matrix.platform }}.release/gen
      - name: Upload headers
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/include.tar.gz
          name: include.tar.gz
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/src.tar.gz
          name: src.tar.gz
      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/libv8_monolith-linux-${{ matrix.platform }}.a.gz
          name: libv8_monolith-linux-${{ matrix.platform }}.a.gz
      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/gen-linux-${{ matrix.platform }}.tar.gz
          name: gen-linux-${{ matrix.platform }}.tar.gz
      # everything below is a sanity-test-only addition, same mechanism
      # and rationale as the build-windows job's own "sanity test" steps
      # below: build repos/lo against this job's own freshly-built (not
      # yet published) v8 output directly, in the same job, instead of
      # waiting for a real release. Not part of the real release
      # artifacts - nothing here gets uploaded. Uses repos/lo's own
      # proven Docker mechanism (docker/Dockerfile.ubuntu, same image
      # repos/lo's own build-linux CI job builds) rather than build.cmd's
      # direct-compile approach, since that's how this platform actually
      # builds lo. The Makefile's v8/libv8_monolith.a and
      # v8/include/.stamp targets are real file/stamp targets - staging
      # the files without also touching the matching .stamp files would
      # make `make` think they're missing and re-download the published
      # (stale) release instead of using this job's fresh build.
      - name: checkout lo (sanity test)
        uses: actions/checkout@v3
        with:
          repository: just-js/lo
          ref: main
          path: lo
      - name: stage freshly-built v8 for lo (sanity test)
        run: |
          mkdir -p lo/v8
          cp -r ${{ github.workspace }}/v8/include lo/v8/include
          touch lo/v8/.stamp lo/v8/include/.stamp
          cp ${{ github.workspace }}/v8/out.gn/linux.${{ matrix.platform }}.release/obj/libv8_monolith.a lo/v8/libv8_monolith.a
      - name: build lo against freshly-built v8 (sanity test)
        run: |
          cd lo
          docker build -t lo-glibc -f docker/Dockerfile.ubuntu .
          docker run --rm -v "$(pwd):/src" -w /src lo-glibc make ARCH=${{ matrix.platform }} lo
          if [ ! -f lo ]; then
            echo "lo was not produced"
            exit 1
          fi
      # the previous step only confirms lo was produced and linked - it
      # doesn't confirm the binary actually runs (same rationale as the
      # Windows job's own separate smoke-test step below its build step).
      - name: run lo smoke test (sanity test)
        run: |
          cd lo
          docker run --rm -v "$(pwd):/src" -w /src lo-glibc sh -c '
            ./lo eval "console.log(\"hello\")" > smoketest-out.txt
            status=$?
            if [ $status -ne 0 ]; then
              echo "lo eval exited with a non-zero code"
              cat smoketest-out.txt
              exit 1
            fi
            if ! grep -q hello smoketest-out.txt; then
              echo "lo eval ran but did not print the expected output"
              cat smoketest-out.txt
              exit 1
            fi
            echo "lo smoke test passed:"
            cat smoketest-out.txt
          '

  build-linux-arm64:
#    if: ${{ false }}  # disable
    name: linux
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        platform: [arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: setup env
        run: |
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"
      - name: git config for cherry-pick identity
        run: |
          # arm64 has no prebuilt clang from Google, so gclient sync
          # checks out the real llvm/llvm-project source tree and
          # applies Chromium's local patches via `git cherry-pick`
          # (x64 skips this entirely - it just fetches a prebuilt).
          # cherry-pick creates a real commit, which needs a git
          # identity - this runner has none configured at all, so it
          # fails with "unable to auto-detect email address" otherwise.
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      # same caching pattern validated on the Windows job (build-windows
      # below) - see its own comments for the actions/cache
      # save-skips-on-later-failure gotcha and the staleness rationale.
      # PLAN.md task 41.
      - name: restore depot_tools cache
        id: depot-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: depot_tools
          key: depot_tools-linux-arm64-v1
      - name: clone depot_tools
        if: steps.depot-tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
      - name: save depot_tools cache
        if: steps.depot-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: depot_tools
          key: depot_tools-linux-arm64-v1
      - name: clean depot_tools checkout
        run: |
          git -C depot_tools reset --hard
          git -C depot_tools clean -fd
      - name: init depot_tools
        run: |
          gclient
      - name: restore v8 checkout cache
        id: v8-cache
        uses: actions/cache/restore@v4
        with:
          path: v8
          key: v8-src-linux-arm64-${{ env.V8_VERSION }}-v1
      - name: fetch v8
        if: steps.v8-cache.outputs.cache-hit != 'true'
        env:
          # plain, unversioned gcc/g++ - matches what build.py's own
          # --host-cc=gcc/--host-cxx=g++/CMAKE_C_COMPILER=gcc flags
          # already assume below. gcc-13 doesn't exist on this runner
          # image at all (confirmed against GitHub's own runner-images
          # docs: ubuntu-22.04-arm only has 10/11/12 preinstalled), and
          # at least one sub-build inside build.py (libxml2, built via
          # its own cmake configure) reads CC/CXX from the ambient
          # environment directly rather than the flags passed to
          # build.py itself, so the two need to actually agree.
          CC: gcc
          CXX: g++
        run: |
          fetch v8
          cd v8
          git checkout branch-heads/$V8_VERSION
          gclient sync
      - name: save v8 checkout cache
        if: steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: v8
          key: v8-src-linux-arm64-${{ env.V8_VERSION }}-v1
      - name: install build deps
        env:
          CC: gcc
          CXX: g++
        run: |
          cd ${{ github.workspace }}/v8
          ./build/install-build-deps.sh
          # build.py sets -DLLVM_ENABLE_LLD=ON for its own from-source
          # LLVM/clang build (wants lld to link the compiler it's
          # building) - confirmed directly in the failing cmake
          # invocation's own flags. lld isn't installed on this runner
          # at all yet (chicken-and-egg: this step is what would
          # eventually produce one), so the host gcc/g++ can't satisfy
          # -fuse-ld=lld. Same class of bfd-vs-lld fragility this
          # session already hit getting repos/lo working on musl - see
          # LO-MUSL.md.
          sudo apt-get install -y lld
      - name: cache bootstrap clang/llvm build
        id: clang-cache
        uses: actions/cache@v4
        with:
          # build.py (below) unconditionally `RmTree`s and reconfigures
          # this directory from scratch every run - confirmed directly
          # in its source, no incremental-build support at all - so
          # there's no point restoring a cache *into* it. Instead this
          # cache lets us skip calling build.py entirely on a hit: V8's
          # own gn build never overrides clang_base_path in
          # args.linux.arm64.gn, so it falls back to Chromium's
          # documented default (build/config/clang/clang.gni) of
          # //third_party/llvm-build/Release+Asserts - the exact same
          # path build.py installs into. If a valid clang/lld is
          # already there, ninja v8_monolith just uses it.
          path: v8/third_party/llvm-build/Release+Asserts
          # tools/clang/scripts/update.py (checked out by gclient sync
          # above, pinned by V8's own DEPS at branch-heads/$V8_VERSION)
          # carries CLANG_REVISION/CLANG_SUB_REVISION - hashing it keys
          # the cache to the actual pinned LLVM commit, not to anything
          # we control. Since we're pinned to a fixed release branch,
          # not a moving one, this should stay stable across our own
          # reruns. The trailing suffix is our own build.py flag set
          # (--disable-asserts --no-tools) - bump it if those change,
          # since that changes what ends up in the cached directory.
          key: clang-arm64-${{ hashFiles('v8/tools/clang/scripts/update.py') }}-noasserts-notools-v1
      - name: build bootstrap clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        env:
          CC: gcc
          CXX: g++
        run: |
          cd ${{ github.workspace }}/v8
          export VPYTHON_BYPASS="manually managed python not supported by chrome operations"
          # --with-ml-inliner-model defaults to 'default' on Linux (empty
          # on every other platform - see build.py's own argparse
          # definition), which triggers downloading/embedding Chrome's
          # MLGO inliner-optimization model via get_tensorflow.py -
          # entirely irrelevant to building V8, Chrome-for-Android-
          # specific. Disabling it explicitly skips that whole path
          # (and the tensorflow pip dependency it needs) rather than
          # trying to satisfy it.
          #
          # --no-tools skips building CHROMIUM_TOOLS (plugins,
          # blink_gc_plugin, raw_ptr_plugin, translation_unit - all
          # Chromium/Blink-specific clang static-analysis plugins, on by
          # default, confirmed directly in build.py's own argparse) -
          # entirely irrelevant to building V8's own library, same
          # pattern as --with-ml-inliner-model= above. Real compile
          # failure hit without it: blink_gc_plugin/BadPatternFinder.cpp
          # fails on GCC 11 (the host bootstrap compiler here) with
          # "'dyn_cast' was not declared in this scope" - an
          # unqualified-ADL-lookup difference between GCC and clang in
          # LLVM-adjacent code that's normally only ever compiled with
          # clang itself (x64 never bootstraps a compiler at all, so it
          # never hits this). Skipping the tools avoids the whole
          # question rather than chasing a GCC/ADL compatibility fix in
          # code we don't need.
          CMAKE_C_COMPILER=gcc CMAKE_CXX_COMPILER=g++ ./tools/clang/scripts/build.py --without-android --host-cc=gcc --host-cxx=g++ --without-fuchsia --use-system-cmake --disable-asserts --with-ml-inliner-model= --no-tools
      - name: build v8
        run: |
          cd ${{ github.workspace }}/v8
          mkdir -p out.gn/linux.${{ matrix.platform }}.release/
          cp ${{ github.workspace }}/args.linux.${{ matrix.platform }}.gn $GITHUB_WORKSPACE/v8/out.gn/linux.${{ matrix.platform }}.release/args.gn
          gn gen out.gn/linux.${{ matrix.platform }}.release
          ninja v8_monolith -C out.gn/linux.${{ matrix.platform }}.release/
          gn args --list out.gn/linux.${{ matrix.platform }}.release
          gzip -9 -c out.gn/linux.${{ matrix.platform }}.release/obj/libv8_monolith.a > ../libv8_monolith-linux-${{ matrix.platform }}.a.gz
          tar -zcvf ../gen-linux-${{ matrix.platform }}.tar.gz out.gn/linux.${{ matrix.platform }}.release/gen
      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/libv8_monolith-linux-${{ matrix.platform }}.a.gz
          name: libv8_monolith-linux-${{ matrix.platform }}.a.gz
      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/gen-linux-${{ matrix.platform }}.tar.gz
          name: gen-linux-${{ matrix.platform }}.tar.gz
      # sanity-test-only addition, same as build-linux-x64's own block
      # above - see its comments for the full rationale.
      - name: checkout lo (sanity test)
        uses: actions/checkout@v3
        with:
          repository: just-js/lo
          ref: main
          path: lo
      - name: stage freshly-built v8 for lo (sanity test)
        run: |
          mkdir -p lo/v8
          cp -r ${{ github.workspace }}/v8/include lo/v8/include
          touch lo/v8/.stamp lo/v8/include/.stamp
          cp ${{ github.workspace }}/v8/out.gn/linux.${{ matrix.platform }}.release/obj/libv8_monolith.a lo/v8/libv8_monolith.a
      - name: build lo against freshly-built v8 (sanity test)
        run: |
          cd lo
          docker build -t lo-glibc -f docker/Dockerfile.ubuntu .
          docker run --rm -v "$(pwd):/src" -w /src lo-glibc make ARCH=${{ matrix.platform }} lo
          if [ ! -f lo ]; then
            echo "lo was not produced"
            exit 1
          fi
      - name: run lo smoke test (sanity test)
        run: |
          cd lo
          docker run --rm -v "$(pwd):/src" -w /src lo-glibc sh -c '
            ./lo eval "console.log(\"hello\")" > smoketest-out.txt
            status=$?
            if [ $status -ne 0 ]; then
              echo "lo eval exited with a non-zero code"
              cat smoketest-out.txt
              exit 1
            fi
            if ! grep -q hello smoketest-out.txt; then
              echo "lo eval ran but did not print the expected output"
              cat smoketest-out.txt
              exit 1
            fi
            echo "lo smoke test passed:"
            cat smoketest-out.txt
          '

  build-mac:
#    if: ${{ false }}  # disable
    name: mac
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [x64,arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: setup env
        run: |
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"
      # same caching pattern validated on the Windows job (build-windows
      # below) - see its own comments for the actions/cache
      # save-skips-on-later-failure gotcha and the staleness rationale.
      # PLAN.md task 41. Keyed per-platform (x64/arm64 are two matrix
      # legs of this same job, each needs its own cache entry).
      - name: restore depot_tools cache
        id: depot-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: depot_tools
          key: depot_tools-mac-${{ matrix.platform }}-v1
      - name: clone depot_tools
        if: steps.depot-tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
      - name: save depot_tools cache
        if: steps.depot-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: depot_tools
          key: depot_tools-mac-${{ matrix.platform }}-v1
      - name: clean depot_tools checkout
        run: |
          git -C depot_tools reset --hard
          git -C depot_tools clean -fd
      - name: init depot_tools
        run: |
          gclient
      - name: restore v8 checkout cache
        id: v8-cache
        uses: actions/cache/restore@v4
        with:
          path: v8
          key: v8-src-mac-${{ matrix.platform }}-${{ env.V8_VERSION }}-v1
      - name: fetch v8
        if: steps.v8-cache.outputs.cache-hit != 'true'
        run: |
          fetch v8
          cd v8
          git checkout branch-heads/$V8_VERSION
          gclient sync
      - name: save v8 checkout cache
        if: steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: v8
          key: v8-src-mac-${{ matrix.platform }}-${{ env.V8_VERSION }}-v1
      - name: build v8
        run: |
          cd ${{ github.workspace }}/v8
          mkdir -p out.gn/${{ matrix.platform }}.release/
          cp ${{ github.workspace }}/args.mac.${{ matrix.platform }}.gn ${{ github.workspace }}/v8/out.gn/${{ matrix.platform }}.release/args.gn
          gn gen out.gn/${{ matrix.platform }}.release
          ninja v8_monolith -C out.gn/${{ matrix.platform }}.release/
          gn args --list out.gn/${{ matrix.platform }}.release
          gzip -9 -c out.gn/${{ matrix.platform }}.release/obj/libv8_monolith.a > ../libv8_monolith-mac-${{ matrix.platform }}.a.gz
          tar -zcvf ../gen-mac-${{ matrix.platform }}.tar.gz out.gn/${{ matrix.platform }}.release/gen
      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/libv8_monolith-mac-${{ matrix.platform }}.a.gz
          name: libv8_monolith-mac-${{ matrix.platform }}.a.gz
      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/gen-mac-${{ matrix.platform }}.tar.gz
          name: gen-mac-${{ matrix.platform }}.tar.gz
      # sanity-test-only addition, same rationale as build-linux-x64's
      # own block - build repos/lo against this job's own freshly-built
      # v8 output directly, no docker needed here (matches repos/lo's
      # own build-mac/build-mac-x64 jobs, which build lo directly on the
      # runner via `make`, not in a container). brew install matches
      # repos/lo's own build-mac job - unconfirmed whether the x64 leg
      # (cross-compiled on this arm64 runner, same as repos/lo's own
      # build-mac-x64 job) actually needs these, but harmless if not.
      - name: checkout lo (sanity test)
        uses: actions/checkout@v3
        with:
          repository: just-js/lo
          ref: main
          path: lo
      - name: stage freshly-built v8 for lo (sanity test)
        run: |
          mkdir -p lo/v8
          cp -r ${{ github.workspace }}/v8/include lo/v8/include
          touch lo/v8/.stamp lo/v8/include/.stamp
          cp ${{ github.workspace }}/v8/out.gn/${{ matrix.platform }}.release/obj/libv8_monolith.a lo/v8/libv8_monolith.a
      - name: build lo against freshly-built v8 (sanity test)
        run: |
          cd lo
          brew install lz4 zstd openssl@3
          make ARCH=${{ matrix.platform }} lo
          if [ ! -f lo ]; then
            echo "lo was not produced"
            exit 1
          fi
      - name: run lo smoke test (sanity test)
        run: |
          cd lo
          ./lo eval "console.log('hello')" > smoketest-out.txt
          status=$?
          if [ $status -ne 0 ]; then
            echo "lo eval exited with a non-zero code"
            cat smoketest-out.txt
            exit 1
          fi
          if ! grep -q hello smoketest-out.txt; then
            echo "lo eval ran but did not print the expected output"
            cat smoketest-out.txt
            exit 1
          fi
          echo "lo smoke test passed:"
          cat smoketest-out.txt

  build-windows:
#    if: ${{ false }}  # disable
    name: windows
    # pinned, not windows-latest: that label now points at Windows
    # Server 2025, which ships VS2026 - the pinned build/vs_toolchain.py
    # this V8 branch checks out only recognizes 2022/2019/2017 (that's
    # literally what its own "supported versions" error message lists),
    # so it can't find a VS install it knows about even though one
    # genuinely exists. Confirmed directly against vs_toolchain.py's
    # real detection code and GitHub's own runner-images docs, not
    # guessed. windows-2022 still ships VS2022 Enterprise at the
    # standard path this script actually checks.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: setup env
        shell: pwsh
        run: |
          echo "${{ github.workspace }}/depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: git config for depot_tools
        run: |
          git config --global depot-tools.allowGlobalGitConfig true
      # depot_tools itself is a much smaller/faster clone than v8 (the
      # real cost is gclient sync below), but still a real network op
      # worth caching. Fixed key (not keyed on V8_VERSION - depot_tools
      # itself is independent of which V8 version we're building), bump
      # the -v2 suffix manually if it ever needs a forced refresh.
      #
      # DEPOT_TOOLS_UPDATE=0 was tried here too, to also skip
      # depot_tools' own self-update check (this session hit one
      # transient failure there: "depot_tools update failed. Conflict
      # in ... ruff_chromium") - reverted: it broke something depot_tools'
      # own git-cache mechanism depends on (real, reproducible
      # `FileNotFoundError` deep in git_cache.py's GetCachePath(), not
      # present before this env var was added). Not worth the
      # uncertainty for a minor speed/flakiness win - the actual
      # expensive, worth-caching part is gclient sync below, not this.
      - name: restore depot_tools cache
        id: depot-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: depot_tools
          key: depot_tools-windows-v2
      - name: clone depot_tools
        if: steps.depot-tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
      # actions/cache's combined action only saves at end-of-job, and
      # explicitly skips saving if *any* step in the job failed -
      # confirmed directly (this session's own previous run: "Post
      # cache v8 checkout" showed completed/skipped despite the clone
      # itself succeeding, because a later, unrelated step - compile -
      # failed). Explicit save right after the clone succeeds instead,
      # decoupled from whatever happens later in the job. Same fix
      # applied to the v8 checkout cache below.
      - name: save depot_tools cache
        if: steps.depot-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: depot_tools
          key: depot_tools-windows-v2
      # depot_tools is disposable tooling, never intentionally edited -
      # always force the checkout to a pristine state before letting
      # `gclient` run its own self-update. Needed because the cache key
      # above is fixed/never expires on its own: the cached checkout gets
      # stale relative to upstream depot_tools over time, and depot_tools'
      # self-update (a `git checkout` to the newer upstream commit) then
      # refuses to proceed once it thinks tracked files differ from the
      # target commit - real, reproduced failure from a stale cache hit:
      # "depot_tools update failed. Conflict in .../depot_tools ... Your
      # local changes to the following files would be overwritten by
      # checkout: git_cl.py, infra/config/recipes.cfg, ..." - and once it
      # starts happening it blocks every subsequent run identically,
      # re-run or not, until the cache is force-refreshed. no-op on a
      # freshly cloned checkout, so safe to always run regardless of
      # cache hit/miss.
      - name: clean depot_tools checkout
        run: |
          git -C depot_tools reset --hard
          git -C depot_tools clean -fd
      - name: init depot_tools
        run: |
          gclient
      # branch-heads/$V8_VERSION is meant to be stable once cut (same
      # trade-off already accepted for the linux-arm64 clang-bootstrap
      # cache) - this session alone has re-run this exact fetch+sync
      # something like 5-6 times against the same 14.5 pin while
      # iterating on the Windows-only libc++ linking issue
      # (task 40/LO-WINDOWS.md), each time paying the full ~5-8 minute
      # cost for no reason. Cached *before* the libc++ patch step below,
      # so the patch (which isn't idempotent - it errors out loudly if
      # its target block is already patched) always runs against a
      # known-unpatched tree, whether freshly synced or freshly
      # restored from cache. Real unconfirmed risk: a full V8 checkout
      # plus its buildtools/third_party DEPS could be several GB -
      # GitHub Actions caches have historically had a ~10GB per-entry
      # limit. Worth checking the actual size after this first
      # cache-populating run rather than assuming it fits.
      - name: restore v8 checkout cache
        id: v8-cache
        uses: actions/cache/restore@v4
        with:
          path: v8
          key: v8-src-windows-${{ env.V8_VERSION }}-v1
      - name: prepared v8 build environment
        if: steps.v8-cache.outputs.cache-hit != 'true'
        run: |
          fetch v8
          cd v8
          git checkout branch-heads/$V8_VERSION
          gclient sync
      # explicit save right after sync succeeds, not deferred to
      # end-of-job - see the depot_tools cache comment above for why
      # (actions/cache's combined action skips saving if any later,
      # unrelated step fails - confirmed directly, not guessed, from
      # this exact job the first time around).
      - name: save v8 checkout cache
        if: steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: v8
          key: v8-src-windows-${{ env.V8_VERSION }}-v1
      - name: patch v8_monolith to depend on libc++ explicitly
        run: |
          # v8_monolith is a `static_library`, and Chromium's automatic
          # libc++ dependency injection (build/config/BUILD.gn's
          # common_deps group) only applies to executable/shared_library/
          # loadable_module targets - confirmed directly in that file's
          # own comments ("Only the executable template in
          # BUILDCONFIG.gn should reference this", same wording for
          # loadable_module/shared_library). static_library is never
          # covered. That's fine for a normal Chromium build, where
          # every static lib eventually gets linked into a real
          # executable/shared_library *within the same build*, which is
          # where libc++ actually gets pulled in - but v8_monolith is
          # unusual: it's meant to be the final, self-contained artifact,
          # consumed entirely outside this build (by repos/lo and any
          # other embedder). Nothing in this graph ever triggers
          # common_deps, so libc++'s compiled implementation objects
          # never become a real dependency of v8_monolith at all, even
          # though `complete_static_lib` would happily fold them in if
          # they were. Real, reproducible symptom without this: dozens
          # of genuine LNK2019/LNK2001 unresolved externals at final
          # link time for libc++ runtime symbols (std::__Cr::__sort,
          # mutex::lock/unlock, locale internals, regex internals,
          # basic_string members, etc) - not caught by V8's own CI since
          # producing a static archive never does symbol resolution.
          # Minimal patch: make v8_monolith depend on libc++ explicitly,
          # same guard common_deps itself uses.
          node -e "
            const fs = require('fs');
            const path = 'BUILD.gn';
            let content = fs.readFileSync(path, 'utf8');
            const re = /(v8_static_library\(\"v8_monolith\"\)\s*\{\s*deps\s*=\s*\[[\s\S]*?\"\/\/build\/win:default_exe_manifest\",\s*\n\s*\])/;
            const m = content.match(re);
            if (!m) { console.error('PATCH TARGET NOT FOUND - v8_monolith deps block has changed shape, aborting'); process.exit(1); }
            const patched = m[1] + '\n    if (use_custom_libcxx) {\n      deps += [ \"//buildtools/third_party/libc++\" ]\n    }';
            content = content.replace(re, patched);
            fs.writeFileSync(path, content);
            console.log('patched v8_monolith to depend on //buildtools/third_party/libc++ when use_custom_libcxx');
          "
          # First attempt at this patch (this session) missed a second
          # piece: the libc++ target itself restricts who's allowed to
          # depend on it via GN's own `visibility` mechanism -
          # confirmed directly, already seen once earlier this session
          # while investigating the missing-dependency root cause, just
          # not connected back to this patch at the time. Real,
          # reproducible failure without this second half:
          # "ERROR at //build/config/BUILDCONFIG.gn:556:5: Dependency
          # not allowed." at `gn gen`, before any compilation - the
          # deps addition above is syntactically fine but GN itself
          # rejects it. v8_monolith is defined in this file's own
          # top-level BUILD.gn, so its label is //:v8_monolith.
          node -e "
            const fs = require('fs');
            const path = 'buildtools/third_party/libc++/BUILD.gn';
            let content = fs.readFileSync(path, 'utf8');
            const re = /(visibility\s*=\s*\[\s*\"\/\/build\/config:common_deps\",\s*\n\s*\"\/\/third_party\/catapult\/devil\",\s*\n\s*\])/;
            const m = content.match(re);
            if (!m) { console.error('VISIBILITY PATCH TARGET NOT FOUND - libc++ BUILD.gn visibility block has changed shape, aborting'); process.exit(1); }
            const patched = m[1] + '\n  visibility += [ \"//:v8_monolith\" ]';
            content = content.replace(re, patched);
            fs.writeFileSync(path, content);
            console.log('patched libc++ visibility to allow //:v8_monolith to depend on it');
          "
        working-directory: v8
      - name: compile v8 static library
        shell: pwsh
        run: |
          New-Item -ItemType directory -Path v8/out.gn/${{ matrix.platform }}.release/
          Copy-Item "args.win.${{ matrix.platform }}.gn" -Destination "v8/out.gn/${{ matrix.platform }}.release/args.gn" -force
          Set-Location -Path v8
          gn gen out.gn/${{ matrix.platform }}.release
          ninja v8_monolith -C out.gn/${{ matrix.platform }}.release/
          gn args --list out.gn/${{ matrix.platform }}.release
      - name: compress artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path ${{ github.workspace }}/v8/out.gn/${{ matrix.platform }}.release/obj/v8_monolith.lib -Destination ${{ github.workspace }}/libv8_monolith-win-${{ matrix.platform }}.zip
          Compress-Archive -Path ${{ github.workspace }}/v8/out.gn/${{ matrix.platform }}.release/gen -Destination ${{ github.workspace }}/gen-win-${{ matrix.platform }}.zip
      - name: package libc++ headers
        shell: pwsh
        run: |
          # args.win.${{ matrix.platform }}.gn sets use_custom_libcxx=true,
          # so v8_monolith.lib was compiled against this exact vendored
          # libc++, not MSVC's own STL (see C++.md entry 2) - consumers
          # like repos/lo need the matching headers to link cleanly
          # against it. Two separate locations, confirmed directly
          # against Chromium's own build/config/c++/BUILD.gn:
          #  - third_party/libc++/src/include: the actual STL headers,
          #    added via a plain -I flag.
          #  - buildtools/third_party/libc++/{__config_site,
          #    __assertion_handler}: two loose ABI-config headers next
          #    to libc++'s own BUILD.gn, added via a separate directory
          #    -I flag (confirmed via GitHub's contents listing for that
          #    directory - nothing else there is a header).
          # Preserving this relative layout in the archive means a
          # consumer's -I flags can point at the same two paths
          # unmodified.
          New-Item -ItemType Directory -Path staging/third_party/libc++/src -Force | Out-Null
          Copy-Item -Recurse -Path ${{ github.workspace }}/v8/third_party/libc++/src/include -Destination staging/third_party/libc++/src/include
          New-Item -ItemType Directory -Path staging/buildtools/third_party/libc++ -Force | Out-Null
          Copy-Item -Path ${{ github.workspace }}/v8/buildtools/third_party/libc++/__config_site,${{ github.workspace }}/v8/buildtools/third_party/libc++/__assertion_handler -Destination staging/buildtools/third_party/libc++/
          Compress-Archive -Path staging/* -Destination ${{ github.workspace }}/libcxx-headers-win-${{ matrix.platform }}.zip
      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/libv8_monolith-win-${{ matrix.platform }}.zip
          name: libv8_monolith-win-${{ matrix.platform }}.zip
      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/gen-win-${{ matrix.platform }}.zip
          name: gen-win-${{ matrix.platform }}.zip
      - name: Upload libc++ headers
        uses: actions/upload-artifact@v4
        with:
          path: ${{ github.workspace }}/libcxx-headers-win-${{ matrix.platform }}.zip
          name: libcxx-headers-win-${{ matrix.platform }}.zip
      # everything below is a sanity-test-only addition: build repos/lo
      # against this job's own freshly-built (not yet published) v8
      # output directly, in the same job. Avoids the round-trip this
      # session has otherwise needed for every Windows iteration (wait
      # for this job -> cut a v8 release -> bump repos/lo's V8 pin ->
      # wait for repos/lo's own CI). Not part of the real release
      # artifacts - nothing here gets uploaded.
      - name: checkout lo (sanity test)
        uses: actions/checkout@v3
        with:
          repository: just-js/lo
          ref: main
          path: lo
      - name: stage freshly-built v8 for lo (sanity test)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path lo/v8/third_party/libc++/src -Force | Out-Null
          New-Item -ItemType Directory -Path lo/v8/buildtools/third_party/libc++ -Force | Out-Null
          Copy-Item -Recurse -Path v8/include -Destination lo/v8/include
          Copy-Item -Path v8/out.gn/${{ matrix.platform }}.release/obj/v8_monolith.lib -Destination lo/v8/v8_monolith.lib
          Copy-Item -Recurse -Path v8/third_party/libc++/src/include -Destination lo/v8/third_party/libc++/src/include
          Copy-Item -Path v8/buildtools/third_party/libc++/__config_site,v8/buildtools/third_party/libc++/__assertion_handler -Destination lo/v8/buildtools/third_party/libc++/
      - name: build lo against freshly-built v8 (sanity test)
        shell: cmd
        run: |
          rem this job's own runner is windows-2022 (pinned - V8's own
          rem vs_toolchain.py doesn't recognize VS2026, see the
          rem build-windows job comment above), unlike repos/lo's own
          rem windows job which now targets windows-2025 for VS2026's
          rem newer bundled clang-cl. build.cmd's own hardcoded
          rem vcvars64.bat call points at VS2026's path
          rem (...\18\Enterprise), which doesn't exist on this runner -
          rem calling VS2022's real one first sets %WindowsSdkDir%,
          rem which build.cmd's own call is guarded on
          rem (if "%WindowsSdkDir%"=="" ...), so it skips its own
          rem (wrong-for-this-runner) attempt. Prepending the standalone
          rem LLVM 20.1.7 install GitHub's own runner images ship at
          rem C:\Program Files\LLVM\bin (confirmed present on both
          rem windows-2022 and windows-2025 via actions/runner-images
          rem#12565) ahead of PATH gets clang++ >=20 without needing
          rem VS2026 at all here - a second, independent test of
          rem whether that's a viable alternative to the runner switch.
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=C:\Program Files\LLVM\bin;%PATH%
          cd lo
          call build.cmd
          rem build.cmd has no error propagation between its own internal
          rem commands (same real bug documented in repos/lo's own
          rem PLAN.md/task 36 history) - a failed clang++/link step
          rem doesn't stop the script or fail this CI step. Confirmed
          rem directly: this step reported success once already despite
          rem a real LNK1120 (10 unresolved externals, the libcpmt.lib
          rem gap) - explicit check needed, matching the
          rem if-no-files-found: error guarantee repos/lo's own real
          rem windows job already has on its upload step.
          if not exist lo.exe (
            echo lo.exe was not produced - build.cmd failed internally without propagating an error
            exit /b 1
          )
      # the previous step only confirms lo.exe was produced and linked -
      # it doesn't confirm the binary actually runs. A real gap in the
      # libc++ linking chain (e.g. the libcpmt.lib/exception_ptr one
      # documented in LO-WINDOWS.md) can produce a lo.exe that exists but
      # crashes or fails to load at runtime (missing import, unresolved
      # delay-load, etc) - checking exit code and actual output here,
      # not just file presence.
      - name: run lo.exe smoke test (sanity test)
        shell: cmd
        working-directory: lo
        run: |
          lo.exe eval "console.log('hello')" > smoketest-out.txt
          if errorlevel 1 (
            echo lo.exe eval exited with a non-zero code
            type smoketest-out.txt
            exit /b 1
          )
          findstr /C:"hello" smoketest-out.txt >nul
          if errorlevel 1 (
            echo lo.exe eval ran but did not print the expected output
            type smoketest-out.txt
            exit /b 1
          )
          echo lo.exe smoke test passed:
          type smoketest-out.txt
